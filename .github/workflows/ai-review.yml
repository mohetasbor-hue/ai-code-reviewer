name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install anthropic
       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
      - name: Run AI Review
        env:
          ANTHROPIC_API_KEY: "sk-ant-ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ"
        run: |
          python review.py

      - name: Post Comment to PR
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('review_comment.md')) {
              const body = fs.readFileSync('review_comment.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🤖 AI Code Reviewer\n\n${body}`
              });
            }
